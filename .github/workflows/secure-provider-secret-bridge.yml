name: Secure Provider Secret Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secure-provider-secret-bridge.yml'

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: buildmybot2-secure-provider-secret-bridge
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: buildmybot-507112
  GCP_REGION: us-central1
  GCP_SERVICE: buildmybot2
  EXPECTED_GCP_SERVICE_ACCOUNT: buildmybotsa@buildmybot-507112.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/406797137160/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  RUNTIME_SERVICE_ACCOUNT: 406797137160-compute@developer.gserviceaccount.com
  OPENROUTER_SECRET: buildmybot-openrouter-api-key
  TAVILY_PROD_SECRET: buildmybot-tavily-api-key
  TAVILY_DEV_SECRET: buildmybot-tavily-dev-api-key

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" >/dev/null
      - name: Open encrypted transfer bridge
        id: bridge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out /tmp/public.pem
          body="$(base64 -w0 /tmp/public.pem)"
          title="Provider secret bridge public key ${GITHUB_RUN_ID}"
          jq -n --arg title "$title" --arg body "$body" '{title:$title,body:$body}' >/tmp/issue.json
          number="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" --input /tmp/issue.json --jq '.number')"
          echo "public_issue=$number" >> "$GITHUB_OUTPUT"
          echo "Bridge public key published in issue #${number}."
      - name: Receive and install encrypted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_ISSUE: ${{ steps.bridge.outputs.public_issue }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          payload_title="Provider secret bridge payload ${GITHUB_RUN_ID}"
          payload_number=''
          payload_body=''
          for _ in $(seq 1 120); do
            record="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${payload_title}\") | [.number,.body] | @tsv" | head -n1 || true)"
            if [[ -n "$record" ]]; then
              payload_number="${record%%$'\t'*}"
              payload_body="${record#*$'\t'}"
              break
            fi
            sleep 5
          done
          [[ -n "$payload_body" ]] || { gh issue close "$PUBLIC_ISSUE" >/dev/null 2>&1 || true; echo 'Encrypted payload not received.' >&2; exit 2; }
          printf '%s' "$payload_body" | base64 -d >/tmp/payload.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/payload.enc -out /tmp/payload.json -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256
          python3 - <<'PY'
          import json, os
          payload=json.load(open('/tmp/payload.json',encoding='utf-8'))
          specs={
              'openrouter':('sk-or-', '/tmp/openrouter.key'),
              'tavily_prod':('tvly-', '/tmp/tavily-prod.key'),
              'tavily_dev':('tvly-', '/tmp/tavily-dev.key'),
          }
          for field,(prefix,path) in specs.items():
              value=payload.get(field,'')
              if not isinstance(value,str) or not value.startswith(prefix) or len(value)<20:
                  raise SystemExit(f'Invalid {field} credential payload')
              with open(path,'w',encoding='utf-8') as f: f.write(value.strip())
              os.chmod(path,0o600)
          os.remove('/tmp/payload.json')
          PY
          ensure_secret() {
            local name="$1" file="$2"
            if ! gcloud secrets describe "$name" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              gcloud secrets create "$name" --project "$GCP_PROJECT_ID" --replication-policy=automatic >/dev/null
            fi
            gcloud secrets versions add "$name" --project "$GCP_PROJECT_ID" --data-file="$file" >/dev/null
            gcloud secrets add-iam-policy-binding "$name" --project "$GCP_PROJECT_ID" --member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" --role roles/secretmanager.secretAccessor --quiet >/dev/null
          }
          ensure_secret "$OPENROUTER_SECRET" /tmp/openrouter.key
          ensure_secret "$TAVILY_PROD_SECRET" /tmp/tavily-prod.key
          ensure_secret "$TAVILY_DEV_SECRET" /tmp/tavily-dev.key
          gcloud run services update "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --update-secrets TAVILY_API_KEY=${TAVILY_PROD_SECRET}:latest,OPENROUTER_API_KEY=${OPENROUTER_SECRET}:latest,OPENROUTER_API_KEY_2=${OPENROUTER_SECRET}:latest --quiet >/dev/null
          python3 - <<'PY'
          import json, urllib.request
          tavily=open('/tmp/tavily-prod.key',encoding='utf-8').read().strip()
          req=urllib.request.Request('https://api.tavily.com/search',data=json.dumps({'query':'Tavily Search API','search_depth':'basic','max_results':1}).encode(),headers={'Content-Type':'application/json','Authorization':f'Bearer {tavily}'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              if r.status != 200: raise SystemExit(f'Tavily verification returned HTTP {r.status}')
          openrouter=open('/tmp/openrouter.key',encoding='utf-8').read().strip()
          req=urllib.request.Request('https://openrouter.ai/api/v1/key',headers={'Authorization':f'Bearer {openrouter}'})
          with urllib.request.urlopen(req,timeout=20) as r:
              if r.status != 200: raise SystemExit(f'OpenRouter verification returned HTTP {r.status}')
              data=json.load(r)
              if not isinstance(data,dict): raise SystemExit('Unexpected OpenRouter verification response')
          print('BuildMyBot2 Tavily and OpenRouter credentials verified and bound to Cloud Run.')
          PY
          rm -f /tmp/private.pem /tmp/public.pem /tmp/payload.enc /tmp/openrouter.key /tmp/tavily-prod.key /tmp/tavily-dev.key
          gh issue close "$payload_number" >/dev/null 2>&1 || true
          gh issue close "$PUBLIC_ISSUE" >/dev/null 2>&1 || true
