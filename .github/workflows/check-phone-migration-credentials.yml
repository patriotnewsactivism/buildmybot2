name: Check phone migration credential availability

on:
  push:
    branches: [feat/phone-agent-activation]
    paths:
      - '.github/workflows/check-phone-migration-credentials.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in DATABASE_URL SUPABASE_DATABASE_URL SUPABASE_DB_URL SUPABASE_DB_PASSWORD POSTGRES_PASSWORD SUPABASE_ACCESS_TOKEN; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name=present"
              found=1
            else
              echo "$name=absent"
            fi
          done
          if (( ! found )); then
            echo 'No database-management credential is present.' >&2
            exit 2
          fi
