name: Apply phone agent activation migration

on:
  push:
    branches: [feat/phone-agent-activation]
    paths:
      - '.github/workflows/apply-phone-agent-migration.yml'

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EXPECTED_PROJECT_REF: evkjlnbpntimbxklnhoz
      GCP_PROJECT_ID: buildmybot-507112
      GCP_REGION: ${{ vars.BUILDMYBOT_GCP_REGION || secrets.BUILDMYBOT_GCP_REGION || vars.GCP_CLOUD_RUN_REGION || secrets.GCP_CLOUD_RUN_REGION || 'us-central1' }}
      GCP_SERVICE: buildmybot2
      GCP_WORKLOAD_IDENTITY_PROVIDER: projects/406797137160/locations/global/workloadIdentityPools/github-pool/providers/github-provider
      GCP_SERVICE_ACCOUNT: buildmybotsa@buildmybot-507112.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phone-agent-activation
      - name: Authenticate with Google Workload Identity
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Recover existing database connection without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            service_json="$(gcloud run services describe "$GCP_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --platform managed --format=json)"
            plain="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "DATABASE_URL") | .value // empty' <<<"$service_json")"
            secret_name="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "DATABASE_URL") | .valueFrom.secretKeyRef.name // empty' <<<"$service_json")"
            secret_version="$(jq -r '.spec.template.spec.containers[0].env[]? | select(.name == "DATABASE_URL") | .valueFrom.secretKeyRef.key // "latest"' <<<"$service_json")"
            if [[ -n "$plain" ]]; then
              DATABASE_URL="$plain"
            elif [[ -n "$secret_name" ]]; then
              DATABASE_URL="$(gcloud secrets versions access "$secret_version" --project "$GCP_PROJECT_ID" --secret "$secret_name")"
            fi
          fi
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo 'No DATABASE_URL exists in GitHub production secrets or the current Cloud Run service.' >&2
            echo 'Candidate Google Secret Manager entries (names only):' >&2
            gcloud secrets list --project "$GCP_PROJECT_ID" --format='value(name)' | grep -Ei 'database|postgres|supabase|db[-_]?url' || true
            exit 2
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
      - name: Validate production database target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DATABASE_URL" != *"$EXPECTED_PROJECT_REF"* ]]; then
            echo 'Refusing migration: recovered DATABASE_URL does not identify the BuildMyBot Supabase project.' >&2
            exit 3
          fi
          echo 'Production database target matches the BuildMyBot project reference.'
      - name: Apply phone activation migration
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260901203000_phone_agent_activation.sql
      - name: Verify phone activation schema
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT CASE WHEN to_regclass('public.telephony_accounts') IS NOT NULL THEN 'telephony_accounts=ok' ELSE 'telephony_accounts=missing' END;
            SELECT CASE WHEN to_regclass('public.phone_agent_activations') IS NOT NULL THEN 'phone_agent_activations=ok' ELSE 'phone_agent_activations=missing' END;
            SELECT 'destination_number_id=' || data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='phone_agent_activations' AND column_name='destination_number_id';
            SELECT 'phone_provider_account=' || data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='phone_numbers' AND column_name='provider_account_sid';
            SELECT 'phone_voice_agent=' || data_type FROM information_schema.columns WHERE table_schema='public' AND table_name='phone_numbers' AND column_name='voice_agent_id';
          " | tee /tmp/schema.txt
          grep -Fx 'telephony_accounts=ok' /tmp/schema.txt
          grep -Fx 'phone_agent_activations=ok' /tmp/schema.txt
          grep -Fx 'destination_number_id=uuid' /tmp/schema.txt
          grep -Fx 'phone_provider_account=text' /tmp/schema.txt
          grep -Fx 'phone_voice_agent=text' /tmp/schema.txt
