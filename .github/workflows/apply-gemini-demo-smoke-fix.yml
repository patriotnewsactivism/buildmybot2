name: Apply Gemini demo smoke verifier fix

on:
  push:
    branches:
      - fix/gemini-demo-deploy-smoke

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch verifier
        run: python scripts/patch_gemini_demo_smoke.py
      - name: Remove one-time helpers
        run: rm scripts/patch_gemini_demo_smoke.py .github/workflows/apply-gemini-demo-smoke-fix.yml
      - name: Commit verifier fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Gemini demo production smoke verification"
          git push
