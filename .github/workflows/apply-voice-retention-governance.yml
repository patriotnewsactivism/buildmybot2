name: Apply voice retention governance

on:
  push:
    branches:
      - feat/voice-retention-governance

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply deterministic runtime patch
        run: node scripts/apply-voice-retention-governance.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format generated voice changes
        run: npx --no-install biome check --write --unsafe shared/voice-commercial-policy.ts shared/voice-team.ts api/voice/telnyx-live.ts test/voice-commercial-policy.test.ts

      - name: Verify changed voice source
        run: npx --no-install biome check --diagnostic-level=error shared/voice-commercial-policy.ts shared/voice-team.ts api/voice/telnyx-live.ts test/voice-commercial-policy.test.ts

      - name: Run retention policy tests
        run: npm run test:run -- test/voice-commercial-policy.test.ts

      - name: Build
        run: npm run build

      - name: Commit verified patch and remove one-shot machinery
        run: |
          rm scripts/apply-voice-retention-governance.mjs
          rm .github/workflows/apply-voice-retention-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat(voice): enforce retention authority in live Telnyx runtime"
          git push origin HEAD:feat/voice-retention-governance
