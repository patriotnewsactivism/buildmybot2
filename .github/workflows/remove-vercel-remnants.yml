name: One-shot remove Vercel remnants

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-vercel-remnants.yml
      - scripts/remove-vercel-remnants.mjs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply platform-neutral cleanup
        run: node scripts/remove-vercel-remnants.mjs

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify no direct Vercel runtime dependency remains
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .vercelignore
          ! grep -R "@vercel/" --include='*.ts' --include='*.tsx' --include='package.json' --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist .
          ! grep -R "VercelRequest\|VercelResponse" --include='*.ts' --include='*.tsx' --exclude-dir=node_modules --exclude-dir=coverage --exclude-dir=dist .
          ! grep -q '"@vercel/' package.json

      - name: Run maintained tests
        run: npm run test:run -- --exclude test/voice-agent.test.ts

      - name: Run flagship voice tests
        run: npm run test:run -- test/voice-agent.test.ts

      - name: Production build
        run: npm run build

      - name: Remove one-shot machinery
        run: rm .github/workflows/remove-vercel-remnants.yml scripts/remove-vercel-remnants.mjs

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: remove Vercel runtime remnants"
          git push origin HEAD:main
