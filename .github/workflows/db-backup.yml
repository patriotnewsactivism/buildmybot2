name: Database backup

# The Supabase project had NO backups at all — 115 tables of live customer data
# with nothing to restore from. Platform backups need a paid plan; this is the
# logical equivalent and costs nothing extra: the database is ~45MB, so a
# compressed dump is a few MB a night.
#
# Restore (to a scratch project first — never straight over production):
#   gsutil cp gs://<bucket>/buildmybot2/<file>.sql.gz .
#   gunzip -c <file>.sql.gz | psql "<target DATABASE_URL>"

on:
  schedule:
    # 08:17 UTC — off the hour so it does not contend with the 13:00 UTC AI-team
    # cron, and off :00 so it is not queued behind everyone else's midnight jobs.
    - cron: '17 8 * * *'
  workflow_dispatch: {} # manual "Run workflow" from the Actions tab

permissions:
  contents: read
  # Required to mint the OIDC token for Workload Identity Federation. Without
  # it google-github-actions/auth cannot federate and falls through to the
  # service-account JSON, which is not configured on this repo.
  id-token: write

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: buildmybot-507112
  BUCKET: buildmybot2-db-backups
  RETENTION_DAYS: '30'
  # Same identity deploy-cloud-run.yml uses. That workflow authenticates by
  # Workload Identity Federation and only falls back to a JSON key; the key
  # secret is empty on this repo, which is why the first run of this backup
  # died in 12s on "must specify exactly one of workload_identity_provider or
  # credentials_json".
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/406797137160/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  EXPECTED_GCP_SERVICE_ACCOUNT: buildmybotsa@buildmybot-507112.iam.gserviceaccount.com
  GCP_SA_KEY: ${{ secrets.BUILDMYBOT_GCP_SA_KEY || secrets.GCP_SA_KEY }}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Fail with the reason rather than letting auth report the generic
      # "specify exactly one of ..." message, which says nothing about which
      # credential is missing.
      - name: Check a Google credential is configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ]]; then
            echo "Using Workload Identity for $EXPECTED_GCP_SERVICE_ACCOUNT"
          elif [[ -n "${GCP_SA_KEY:-}" ]]; then
            echo "Using service-account JSON"
          else
            echo "No Google authentication configured: set the Workload Identity provider or BUILDMYBOT_GCP_SA_KEY." >&2
            exit 2
          fi

      - name: Authenticate with Google Workload Identity
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with service-account JSON
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ env.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Ensure the backup bucket exists, is private, and expires old dumps
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud storage buckets describe "gs://$BUCKET" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            # Uniform access + public access prevention: these dumps are customer
            # data and must never be reachable by object ACL or anonymous read.
            gcloud storage buckets create "gs://$BUCKET" \
              --project "$GCP_PROJECT_ID" \
              --location=us-central1 \
              --uniform-bucket-level-access \
              --public-access-prevention
            echo "Created gs://$BUCKET"
          fi
          cat > /tmp/lifecycle.json <<JSON
          {"rule":[{"action":{"type":"Delete"},"condition":{"age":$RETENTION_DAYS}}]}
          JSON
          gcloud storage buckets update "gs://$BUCKET" --lifecycle-file=/tmp/lifecycle.json
          echo "Retention: $RETENTION_DAYS days"

      # This project talks to Supabase over the REST API, not Postgres, so it
      # has never needed a libpq connection string and the DATABASE_URL Actions
      # secret is empty. pg_dump does need one. Look in Secret Manager too —
      # the same place deploy-cloud-run.yml recovers its other runtime secrets
      # from, and reachable with the Workload Identity credential this job
      # already holds — so the credential can live in one place rather than
      # being duplicated into Actions.
      - name: Resolve the database connection string
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DATABASE_URL:-}" ]]; then
            echo "Using the DATABASE_URL Actions secret."
            echo "::add-mask::$DATABASE_URL"
            echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
            exit 0
          fi

          for name in buildmybot-database-url buildmybot2-database-url database-url; do
            if value="$(gcloud secrets versions access latest \
                  --project "$GCP_PROJECT_ID" --secret "$name" 2>/dev/null)" \
               && [[ -n "$value" ]]; then
              echo "::add-mask::$value"
              echo "DATABASE_URL=$value" >> "$GITHUB_ENV"
              echo "Loaded DATABASE_URL from Google Secret Manager secret '$name'."
              exit 0
            fi
          done

          echo "::error::No Postgres connection string available, so there is nothing to dump." >&2
          echo "Set ONE of the following, then re-run:" >&2
          echo "  1. A 'DATABASE_URL' GitHub Actions secret on this repository, or" >&2
          echo "  2. A Google Secret Manager secret named 'buildmybot-database-url'" >&2
          echo "     in project $GCP_PROJECT_ID (this job's service account can already read it)." >&2
          echo "Get the value from Supabase → Project Settings → Database → Connection string (URI)." >&2
          echo "Either port works; the dump switches 6543 to 5432 itself." >&2
          exit 1

      - name: Dump the database
        shell: bash
        run: |
          set -euo pipefail

          # Supabase's transaction pooler (port 6543) cannot serve pg_dump: it
          # multiplexes statements across backends, so the consistent snapshot a
          # dump needs is not available. Session mode on the same host (5432) is.
          dump_url="${DATABASE_URL/:6543/:5432}"
          if [[ "$dump_url" != "$DATABASE_URL" ]]; then
            echo "Switched from the transaction pooler to session mode for the dump."
          fi

          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          out="buildmybot2-${stamp}.sql.gz"

          # Server is PostgreSQL 17; pg_dump must be >= the server, and the
          # ubuntu runner ships an older client. Pin the matching major version
          # rather than depend on whatever the image happens to carry.
          docker run --rm -e PGCONNECT_TIMEOUT=30 postgres:17-alpine \
            pg_dump --no-owner --no-privileges --clean --if-exists \
                    --quote-all-identifiers "$dump_url" \
            | gzip -9 > "$out"

          size=$(stat -c%s "$out")
          echo "dump=$out size=${size}"
          echo "DUMP_FILE=$out" >> "$GITHUB_ENV"

          # A dump that failed part-way still exits 0 through the pipe and leaves
          # a small, useless file. Prove it actually contains a schema before it
          # is allowed to count as a backup.
          if [[ "$size" -lt 20000 ]]; then
            echo "::error::Dump is only ${size} bytes — that is not a real backup of a 45MB database." >&2
            exit 1
          fi
          if ! gunzip -c "$out" | head -c 2000000 | grep -q 'CREATE TABLE'; then
            echo "::error::Dump contains no CREATE TABLE statements — refusing to upload it." >&2
            exit 1
          fi
          tables=$(gunzip -c "$out" | grep -c '^CREATE TABLE' || true)
          echo "Verified: ${tables} tables in the dump."
          echo "DUMP_TABLES=$tables" >> "$GITHUB_ENV"

      - name: Upload
        shell: bash
        run: |
          set -euo pipefail
          dest="gs://$BUCKET/buildmybot2/$DUMP_FILE"
          gcloud storage cp "$DUMP_FILE" "$dest"
          echo "Uploaded $dest"
          {
            echo "### Database backup"
            echo
            echo "- File: \`$DUMP_FILE\`"
            echo "- Tables: $DUMP_TABLES"
            echo "- Destination: \`$dest\`"
            echo "- Retention: $RETENTION_DAYS days"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the object is readable back
        shell: bash
        run: |
          set -euo pipefail
          # An upload that reports success but leaves nothing readable is the
          # failure mode that makes a backup strategy worthless.
          gcloud storage ls -l "gs://$BUCKET/buildmybot2/$DUMP_FILE"
