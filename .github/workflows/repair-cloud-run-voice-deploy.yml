name: Repair Cloud Run voice deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-cloud-run-voice-deploy.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch production deploy workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-cloud-run.yml')
          text = path.read_text()

          old_concurrency = '  cancel-in-progress: false\n'
          if old_concurrency not in text:
              raise SystemExit('Expected deploy concurrency setting was not found')
          text = text.replace(
              old_concurrency,
              '  cancel-in-progress: true\n',
              1,
          )

          old_keys = '            OPENROUTER_API_KEY_2 OPENROUTER_API_KEY OPENAI_API_KEY CEREBRAS_API_KEY GROQ_API_KEY GEMINI_API_KEY COHERE_API_KEY \\\n'
          new_keys = '            OPENROUTER_API_KEY OPENAI_API_KEY CEREBRAS_API_KEY GROQ_API_KEY GEMINI_API_KEY COHERE_API_KEY \\\n'
          if old_keys not in text:
              raise SystemExit('Expected runtime key list was not found')
          text = text.replace(old_keys, new_keys, 1)

          marker = '      - name: Apply available runtime configuration without deleting existing values\n'
          replacement = marker + '        # OPENROUTER_API_KEY_2 is intentionally preserved as its existing Cloud Run Secret Manager reference.\n'
          if marker not in text:
              raise SystemExit('Expected runtime configuration step was not found')
          text = text.replace(marker, replacement, 1)

          path.write_text(text)
          PY

      - name: Remove one-use repair workflow
        run: rm .github/workflows/repair-cloud-run-voice-deploy.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-cloud-run.yml .github/workflows/repair-cloud-run-voice-deploy.yml
          git commit -m "Preserve Cloud Run secret-backed runtime values"
          git push origin HEAD:main
