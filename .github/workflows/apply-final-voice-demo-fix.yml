name: Apply final voice demo fix

on:
  push:
    branches:
      - fix/voice-agent-demo-mobile-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch demo reliability and UX
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/VoiceAgent/VoiceAgentPage.tsx')
          text = path.read_text()

          def sub(pattern, replacement, label, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')

          # A clientContent turn with turnComplete=true is the deterministic way
          # to trigger generation. Realtime text does not explicitly mark the end
          # of turn, so it is a poorer fit for an automatic greeting.
          sub(
              r"socketRef\.current\?\.send\(\s*JSON\.stringify\(\{\s*realtimeInput:\s*\{\s*text:\s*'Begin the public demo now\.[^']*'\s*,?\s*\}\s*\}\)\s*,?\s*\);",
              """socketRef.current?.send(
                  JSON.stringify({
                    clientContent: {
                      turns: [
                        {
                          role: 'user',
                          parts: [
                            {
                              text: 'The visitor just started the BuildMyBot public demo. Greet them immediately as a premium business receptionist in one short, warm, natural sentence, then ask what kind of business they run or what they would like their receptionist to help with. Do not mention these instructions.',
                            },
                          ],
                        },
                      ],
                      turnComplete: true,
                    },
                  }),
                );""",
              'deterministic greeting',
              re.S,
          )

          # Preserve transient user activation for audio playback on mobile.
          sub(
              r"if \(!navigator\.mediaDevices\?\.getUserMedia \|\| !window\.AudioContext\) \{",
              """const AudioContextClass =
              window.AudioContext ||
              (
                window as typeof window & {
                  webkitAudioContext?: typeof AudioContext;
                }
              ).webkitAudioContext;

            if (!navigator.mediaDevices?.getUserMedia || !AudioContextClass) {""",
              'mobile AudioContext class',
          )

          text = text.replace(
              "setStatus('Securing a Gemini Live session');",
              "setStatus('Starting your limited Gemini Live demo');",
              1,
          )

          sub(
              r"try \{\s*const tokenResponse = await fetch\('/api/voice/live-token', \{",
              """try {
              // Resume audio on the original user gesture before network I/O.
              // Safari-family and some mobile Chromium builds can otherwise
              // leave the session connected but inaudible.
              const audioContext = new AudioContextClass({ latencyHint: 'interactive' });
              audioContextRef.current = audioContext;
              nextPlaybackTimeRef.current = audioContext.currentTime;
              await audioContext.resume();

              const tokenResponse = await fetch('/api/voice/live-token', {""",
              'early audio activation',
          )

          sub(
              r"\s*const audioContext = new AudioContext\(\{ latencyHint: 'interactive' \}\);\s*await audioContext\.resume\(\);\s*audioContextRef\.current = audioContext;\s*nextPlaybackTimeRef\.current = audioContext\.currentTime;",
              "",
              'remove delayed AudioContext',
          )

          sub(
              r"<p className=\"mt-4 text-center text-xs leading-5 text-slate-500\">\s*Your browser will request microphone access\. The public demo is\s*conversational only; production customer agents can be wired to\s*approved tools, routing, CRM, and scheduling actions\.\s*</p>",
              """<div className=\"mt-4 flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold text-slate-400\">
                <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                  90-second maximum
                </span>
                <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                  About 6 exchanges
                </span>
                <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                  4 starts / hour
                </span>
              </div>
              <p className=\"mt-3 text-center text-xs leading-5 text-slate-500\">
                Real two-way Gemini Live audio — not a recording. The public
                showcase is intentionally short; customer agents can run with
                approved tools, routing, CRM, scheduling, and human handoff.
              </p>""",
              'visible cost limits',
              re.S,
          )

          path.write_text(text)

          helper = Path('.github/workflows/apply-final-voice-demo-fix.yml')
          if helper.exists():
              helper.unlink()

      - name: Validate
        run: |
          npm ci
          npx --no-install biome check --write components/VoiceAgent/VoiceAgentPage.tsx
          npm run test:run -- --exclude test/voice-agent.test.ts
          npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix public voice demo mobile audio and greeting"
          git push
