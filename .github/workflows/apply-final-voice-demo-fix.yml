name: Apply final voice demo fix

on:
  push:
    branches:
      - fix/voice-agent-demo-mobile-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/patch_voice_demo_final.py
      - run: npm ci
      - run: npx --no-install biome check --write components/VoiceAgent/VoiceAgentPage.tsx
      - run: npm run test:run -- --exclude test/voice-agent.test.ts
      - run: npm run build
      - name: Remove one-time helpers
        run: rm scripts/patch_voice_demo_final.py .github/workflows/apply-final-voice-demo-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix public voice demo mobile audio and greeting"
          git push
