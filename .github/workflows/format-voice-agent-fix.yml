name: Format voice agent fix

on:
  push:
    branches:
      - fix/gemini-live-voice-agent-page

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Biome fixes
        run: >-
          npx --no-install biome check --write
          components/VoiceAgent/VoiceAgentPage.tsx
          api/voice/live-token.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/VoiceAgent/VoiceAgentPage.tsx api/voice/live-token.ts
          git commit -m "Format voice agent fix"
          git push
