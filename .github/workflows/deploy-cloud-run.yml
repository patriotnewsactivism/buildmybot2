name: Deploy BuildMyBot2 Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'components/**'
      - 'hooks/**'
      - 'services/**'
      - 'src/**'
      - 'public/**'
      - 'App.tsx'
      - 'index.tsx'
      - 'index.html'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'shared/**'
      - 'server.ts'
      - 'constants.ts'
      - 'types.ts'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: buildmybot2-cloud-run-production
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: buildmybot-507112
  EXPECTED_GCP_SERVICE_ACCOUNT: buildmybotsa@buildmybot-507112.iam.gserviceaccount.com
  GCP_REGION: ${{ vars.BUILDMYBOT_GCP_REGION || secrets.BUILDMYBOT_GCP_REGION || vars.GCP_CLOUD_RUN_REGION || secrets.GCP_CLOUD_RUN_REGION || 'us-central1' }}
  GCP_SERVICE: buildmybot2
  ARTIFACT_REPO: cloud-run-source-deploy
  PUBLIC_DOMAIN: buildmybot.app
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/406797137160/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  GCP_SA_KEY: ${{ secrets.BUILDMYBOT_GCP_SA_KEY || secrets.GCP_SA_KEY }}

  SUPABASE_URL: https://evkjlnbpntimbxklnhoz.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SESSION_JWT_SECRET: ${{ secrets.SESSION_JWT_SECRET }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  INBOUND_EMAIL_WEBHOOK_SECRET: ${{ secrets.INBOUND_EMAIL_WEBHOOK_SECRET }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
  STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
  STRIPE_WHITELABEL_PRICE_ID: ${{ secrets.STRIPE_WHITELABEL_PRICE_ID }}
  RETELL_API_KEY: ${{ secrets.RETELL_API_KEY }}
  RETELL_WEBHOOK_SECRET: ${{ secrets.RETELL_WEBHOOK_SECRET }}
  CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
  VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
  VAPI_WEBHOOK_SECRET: ${{ secrets.VAPI_WEBHOOK_SECRET }}
  TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
  TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
  TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
  TWILIO_WEBHOOK_BASE_URL: ${{ vars.TWILIO_WEBHOOK_BASE_URL || secrets.TWILIO_WEBHOOK_BASE_URL }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  BASE44_SUPERAGENT_API_KEY: ${{ secrets.BASE44_SUPERAGENT_API_KEY }}
  PORTFOLIO_INTAKE_SECRET: ${{ secrets.PORTFOLIO_INTAKE_SECRET }}
  PORTFOLIO_OWNER_EMAIL: ${{ vars.PORTFOLIO_OWNER_EMAIL || secrets.PORTFOLIO_OWNER_EMAIL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate Google Cloud configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ]]; then
            echo "Using Workload Identity for $EXPECTED_GCP_SERVICE_ACCOUNT"
          elif [[ -n "${GCP_SA_KEY:-}" ]]; then
            actual="$(printf '%s' "$GCP_SA_KEY" | jq -r '.client_email // empty')"
            if [[ "$actual" != "$EXPECTED_GCP_SERVICE_ACCOUNT" ]]; then
              echo "Wrong BuildMyBot Google credential. Expected $EXPECTED_GCP_SERVICE_ACCOUNT but secret contains ${actual:-unknown}." >&2
              exit 3
            fi
          else
            echo "No Google authentication configured." >&2
            exit 2
          fi

      - name: Authenticate with Google Workload Identity
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with service-account JSON
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta

      - name: Load required runtime secrets from Google Secret Manager
        shell: bash
        run: |
          set -euo pipefail

          load_secret_if_missing() {
            local env_name="$1"
            local secret_name="$2"
            local current="${!env_name:-}"
            if [[ -n "$current" ]]; then
              return 0
            fi

            local value
            if value="$(gcloud secrets versions access latest \
              --project "$GCP_PROJECT_ID" \
              --secret "$secret_name" 2>/dev/null)"; then
              if [[ -n "$value" ]]; then
                echo "::add-mask::$value"
                echo "$env_name=$value" >> "$GITHUB_ENV"
                echo "Loaded $env_name from Google Secret Manager."
              fi
            fi
          }

          load_secret_if_missing SUPABASE_SERVICE_ROLE_KEY buildmybot-supabase-service-role-key
          load_secret_if_missing SESSION_JWT_SECRET buildmybot-session-jwt-secret
          load_secret_if_missing OPENROUTER_API_KEY_2 buildmybot-openrouter-api-key-2
          load_secret_if_missing OPENROUTER_API_KEY buildmybot-openrouter-api-key
          load_secret_if_missing GEMINI_API_KEY buildmybot-gemini-api-key

          service_json="$(gcloud run services describe "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --format=json 2>/dev/null || true)"

          load_cloud_run_value_if_missing() {
            local env_name="$1"
            [[ -n "${!env_name:-}" ]] && return 0
            [[ -n "$service_json" ]] || return 0

            local plain secret_name secret_version value
            plain="$(jq -r --arg name "$env_name" '.spec.template.spec.containers[0].env[]? | select(.name == $name) | .value // empty' <<<"$service_json")"
            if [[ -n "$plain" ]]; then
              echo "::add-mask::$plain"
              echo "$env_name=$plain" >> "$GITHUB_ENV"
              echo "Recovered $env_name from the existing Cloud Run service."
              return 0
            fi

            secret_name="$(jq -r --arg name "$env_name" '.spec.template.spec.containers[0].env[]? | select(.name == $name) | .valueFrom.secretKeyRef.name // empty' <<<"$service_json")"
            secret_version="$(jq -r --arg name "$env_name" '.spec.template.spec.containers[0].env[]? | select(.name == $name) | .valueFrom.secretKeyRef.key // "latest"' <<<"$service_json")"
            if [[ -n "$secret_name" ]] && value="$(gcloud secrets versions access "$secret_version" --project "$GCP_PROJECT_ID" --secret "$secret_name" 2>/dev/null)" && [[ -n "$value" ]]; then
              echo "::add-mask::$value"
              echo "$env_name=$value" >> "$GITHUB_ENV"
              echo "Recovered $env_name from its existing Cloud Run Secret Manager binding."
            fi
          }

          for name in ENCRYPTION_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN GEMINI_API_KEY TWILIO_WEBHOOK_BASE_URL; do
            load_cloud_run_value_if_missing "$name"
          done

          if [[ -z "${TWILIO_WEBHOOK_BASE_URL:-}" ]]; then
            service_url="$(gcloud run services describe "$GCP_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --platform managed \
              --format='value(status.url)')"
            if [[ -n "$service_url" ]]; then
              echo "TWILIO_WEBHOOK_BASE_URL=$service_url" >> "$GITHUB_ENV"
              echo "Using the actual Cloud Run service URL for Twilio activation webhooks."
            fi
          fi
      - name: Validate runtime secrets and phone activation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SESSION_JWT_SECRET ENCRYPTION_KEY GEMINI_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_WEBHOOK_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required runtime setting: $name" >&2
              missing=1
            fi
          done
          if [[ -n "${TWILIO_WEBHOOK_BASE_URL:-}" && ! "$TWILIO_WEBHOOK_BASE_URL" =~ ^https:// ]]; then
            echo "TWILIO_WEBHOOK_BASE_URL must be an HTTPS origin reachable by Twilio." >&2
            missing=1
          fi
          if (( missing )); then exit 1; fi

          check_supabase_shape() {
            local resource="$1"
            local label="$2"
            local status
            status="$(curl -sS -o /tmp/bmb-schema-check.json -w '%{http_code}' --max-time 20 \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "${SUPABASE_URL%/}/rest/v1/${resource}")"
            if [[ "$status" != "200" ]]; then
              echo "Supabase phone activation schema check failed for $label (HTTP $status). Apply 20260901203000_phone_agent_activation.sql before deployment." >&2
              cat /tmp/bmb-schema-check.json >&2 || true
              exit 2
            fi
          }

          check_supabase_shape 'telephony_accounts?select=id,provider_account_sid,auth_token_encrypted&limit=1' telephony_accounts
          check_supabase_shape 'phone_agent_activations?select=id,telephony_account_id,destination_number_id,bot_id,knowledge_mode&limit=1' phone_agent_activations
          check_supabase_shape 'phone_numbers?select=id,provider_account_sid,setup_mode,source_number,activation_status,activated_at&limit=1' phone_numbers
          check_supabase_shape 'users?select=id,voice_plan&limit=1' users.voice_plan
      - name: Configure Docker auth
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build immutable image on GitHub runner
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPO/$GCP_SERVICE:$GITHUB_SHA"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy public Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          startup_env="NODE_ENV=production,APP_BASE_URL=https://buildmybot.app,BUILD_SHA=$GITHUB_SHA,PRESIDENT_EMAIL=president@buildmybot.app,SUPABASE_URL=$SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY,SESSION_JWT_SECRET=$SESSION_JWT_SECRET"
          gcloud run deploy "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "${{ steps.image.outputs.image }}" \
            --port 8080 \
            --update-env-vars "$startup_env" \
            --allow-unauthenticated \
            --quiet

      - name: Apply available runtime configuration without deleting existing values
        shell: bash
        run: |
          set -euo pipefail
          delim='__BMB_ENV_7E4A1__'
          spec="^${delim}^NODE_ENV=production${delim}APP_BASE_URL=https://buildmybot.app${delim}BUILD_SHA=$GITHUB_SHA${delim}PRESIDENT_EMAIL=president@buildmybot.app"

          service_json="$(gcloud run services describe "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --format=json)"
          mapfile -t secret_backed < <(jq -r \
            '.spec.template.spec.containers[0].env[]? | select(.valueFrom.secretKeyRef != null) | .name' \
            <<<"$service_json")

          is_secret_backed() {
            local candidate="$1"
            local existing
            for existing in "${secret_backed[@]}"; do
              if [[ "$existing" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          for name in \
            SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SESSION_JWT_SECRET SESSION_SECRET ENCRYPTION_KEY DATABASE_URL \
            OPENROUTER_API_KEY_2 OPENROUTER_API_KEY OPENAI_API_KEY CEREBRAS_API_KEY GROQ_API_KEY GEMINI_API_KEY COHERE_API_KEY \
            TAVILY_API_KEY FIRECRAWL_API_KEY RESEND_API_KEY INBOUND_EMAIL_WEBHOOK_SECRET CRON_SECRET \
            STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_WHITELABEL_PRICE_ID \
            RETELL_API_KEY RETELL_WEBHOOK_SECRET CARTESIA_API_KEY VAPI_API_KEY VAPI_WEBHOOK_SECRET \
            TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_PHONE_NUMBER TWILIO_WEBHOOK_BASE_URL SENTRY_DSN BASE44_SUPERAGENT_API_KEY \
            PORTFOLIO_INTAKE_SECRET PORTFOLIO_OWNER_EMAIL; do
            value="${!name:-}"
            if [[ -z "$value" ]]; then
              continue
            fi
            if is_secret_backed "$name"; then
              echo "Preserving Secret Manager-backed Cloud Run variable: $name"
              continue
            fi
            spec+="${delim}${name}=${value}"
          done

          gcloud run services update "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --update-env-vars "$spec" \
            --quiet

      - name: Configure the public Cloud Run domain
        shell: bash
        run: |
          set -euo pipefail
          if gcloud beta run domain-mappings describe "$PUBLIC_DOMAIN" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --quiet >/dev/null 2>&1; then
            gcloud beta run domain-mappings describe "$PUBLIC_DOMAIN" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='yaml(status.resourceRecords,status.conditions)'
          elif mapping_output="$(gcloud beta run domain-mappings create \
            --service "$GCP_SERVICE" \
            --domain "$PUBLIC_DOMAIN" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --quiet 2>&1)"; then
            echo "$mapping_output"
            gcloud beta run domain-mappings describe "$PUBLIC_DOMAIN" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='yaml(status.resourceRecords,status.conditions)'
          elif [[ "$mapping_output" == *"does not appear to be verified"* ]]; then
            echo "$mapping_output" >&2
            echo "::warning::Cloud Run custom-domain mapping awaits Google Search Console ownership verification."
          else
            echo "$mapping_output" >&2
            exit 1
          fi

      - name: Report agent runtime readiness
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${OPENROUTER_API_KEY_2:-}${OPENROUTER_API_KEY:-}" ]] \
            || missing+=('OPENROUTER_API_KEY_2 (or OPENROUTER_API_KEY) — AI employees cannot reason')
          [[ -n "${CRON_SECRET:-}" ]] \
            || missing+=('CRON_SECRET — scheduled shifts cannot authenticate')
          [[ -n "${RESEND_API_KEY:-}" ]] \
            || missing+=('RESEND_API_KEY — no outbound email')

          if (( ${#missing[@]} )); then
            {
              echo "### ⚠️ Agent runtime is incomplete"
              echo
              for m in "${missing[@]}"; do echo "- $m"; done
            } >> "$GITHUB_STEP_SUMMARY"
            for m in "${missing[@]}"; do echo "::error::Agent runtime missing: $m"; done
          else
            echo '### Agent runtime configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'LLM provider chain, cron auth and outbound email all have credentials.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify live backend and Gemini demo
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --format='value(status.url)')"

          for attempt in {1..30}; do
            if body="$(curl -fsS --max-time 15 "${SERVICE_URL%/}/health" 2>/dev/null)"; then
              live_sha="$(jq -r '.build.sha // empty' <<<"$body")"
              if [[ "$live_sha" == "$GITHUB_SHA" ]]; then
                break
              fi
            fi
            sleep 5
          done

          body="$(curl -fsS --max-time 20 "${SERVICE_URL%/}/health")"
          live_sha="$(jq -r '.build.sha // empty' <<<"$body")"
          if [[ "$live_sha" != "$GITHUB_SHA" ]]; then
            echo "Cloud Run health SHA mismatch. expected=$GITHUB_SHA actual=$live_sha" >&2
            exit 4
          fi

          auth_status="$(curl -sS -o /tmp/auth-user.json -w '%{http_code}' --max-time 20 "${SERVICE_URL%/}/api/auth/user")"
          if [[ "$auth_status" -ge 500 ]]; then
            echo "API smoke test returned HTTP $auth_status" >&2
            cat /tmp/auth-user.json >&2 || true
            exit 5
          fi

          activation_status="$(curl -sS -o /tmp/phone-activation.json -w '%{http_code}' --max-time 20 "${SERVICE_URL%/}/api/phone/activation/status")"
          if [[ "$activation_status" != "401" ]]; then
            echo "Unauthenticated phone activation endpoint returned HTTP $activation_status; expected 401." >&2
            cat /tmp/phone-activation.json >&2 || true
            exit 9
          fi

          unsigned_twilio_status="$(curl -sS -o /tmp/phone-twilio.json -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"AccountSid":"AC00000000000000000000000000000000","CallSid":"CA00000000000000000000000000000000","To":"+15555550100","From":"+15555550101"}' \
            "${SERVICE_URL%/}/api/phone/activation/twilio/inbound")"
          if [[ "$unsigned_twilio_status" != "403" ]]; then
            echo "Unsigned activation Twilio webhook returned HTTP $unsigned_twilio_status; expected 403." >&2
            cat /tmp/phone-twilio.json >&2 || true
            exit 10
          fi

          voice_page_status="$(curl -sS -o /tmp/voice-agent.html -w '%{http_code}' --max-time 20 "${SERVICE_URL%/}/voice-agent")"
          if [[ "$voice_page_status" != "200" ]]; then
            echo "Standalone voice-agent page returned HTTP $voice_page_status" >&2
            exit 6
          fi

          voice_token_status="$(curl -sS -o /tmp/voice-token.json -w '%{http_code}' --max-time 30 \
            -X POST -H 'Content-Type: application/json' -H "Origin: $SERVICE_URL" \
            "${SERVICE_URL%/}/api/voice/live-token")"
          live_token="$(jq -r '.token // empty' /tmp/voice-token.json 2>/dev/null || true)"
          demo_duration="$(jq -r '.maxDurationSeconds // 0' /tmp/voice-token.json 2>/dev/null || true)"
          demo_voice="$(jq -r '.voice // empty' /tmp/voice-token.json 2>/dev/null || true)"
          if [[ "$voice_token_status" != "200" ]] || [[ -z "$live_token" ]]; then
            echo "Gemini Live token smoke test failed with HTTP $voice_token_status" >&2
            cat /tmp/voice-token.json >&2 || true
            exit 7
          fi
          if [[ "$demo_duration" != "90" ]] || [[ -z "$demo_voice" ]]; then
            echo "Gemini demo constraints missing from token response" >&2
            cat /tmp/voice-token.json >&2 || true
            exit 8
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const payload = JSON.parse(fs.readFileSync('/tmp/voice-token.json', 'utf8'));
          const endpoint = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained';
          const url = `${endpoint}?access_token=${encodeURIComponent(payload.token)}`;

          await new Promise((resolve, reject) => {
            const socket = new WebSocket(url);
            let finished = false;
            const finish = (error) => {
              if (finished) return;
              finished = true;
              clearTimeout(timer);
              try { socket.close(1000, 'smoke complete'); } catch {}
              if (error) reject(error);
              else resolve();
            };
            const timer = setTimeout(
              () => finish(new Error('Timed out waiting for Gemini setupComplete')),
              15000,
            );

            socket.addEventListener('open', () => {
              socket.send(JSON.stringify({
                setup: { model: `models/${payload.model}` },
              }));
            });
            socket.addEventListener('message', (event) => {
              let message;
              try {
                message = JSON.parse(String(event.data));
              } catch (error) {
                finish(error);
                return;
              }
              if (message.error?.message) {
                finish(new Error(message.error.message));
              } else if (message.setupComplete) {
                finish();
              }
            });
            socket.addEventListener('error', () => {
              finish(new Error('Gemini constrained WebSocket failed'));
            });
          });
          NODE

          echo "Cloud Run backend: $SERVICE_URL"
          echo "Verified SHA: $live_sha"
          echo "### BuildMyBot2 Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: $SERVICE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $live_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "- /api/auth/user: HTTP $auth_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- /api/phone/activation/status (logged out): HTTP $activation_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- unsigned /api/phone/activation/twilio/inbound: HTTP $unsigned_twilio_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- /voice-agent: HTTP $voice_page_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gemini Live one-use token: HTTP $voice_token_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gemini constrained WebSocket: setupComplete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public demo: ${demo_duration}s, voice ${demo_voice}" >> "$GITHUB_STEP_SUMMARY"
