name: Deploy BuildMyBot Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'hooks/**'
      - 'functions/**'
      - 'public/**'
      - 'App.tsx'
      - 'index.tsx'
      - 'index.html'
      - 'constants.ts'
      - 'types.ts'
      - 'vite.config.ts'
      - '_headers'
      - '_redirects'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildmybot2-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
      PUBLIC_SITE_URL: ${{ vars.BUILDMYBOT_PUBLIC_URL || 'https://www.buildmybot.app' }}
      RAILWAY_ORIGIN: https://buildmybot2-web-production.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether Cloudflare is configured
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "${PAGES_PROJECT:-}" ]] || missing+=(CLOUDFLARE_PAGES_PROJECT)
          if (( ${#missing[@]} )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare Pages deploy skipped; missing: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.gate.outputs.configured == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ''
        run: npm run build

      - name: Confirm Pages assets and origin functions
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/_headers dist/_redirects dist/index.html 'functions/[[path]].ts' 'functions/api/[[path]].ts'; do
            [[ -f "$f" ]] || { echo "Missing $f" >&2; exit 1; }
          done

      - name: Wait for Railway deployment of this commit
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          live_sha=''
          status=000
          for _ in $(seq 1 40); do
            status="$(curl -sS -o /tmp/railway-health.json -w '%{http_code}' --max-time 20 "${RAILWAY_ORIGIN}/api/health" || true)"
            live_sha="$(jq -r '.build.sha // empty' /tmp/railway-health.json 2>/dev/null || true)"
            if [[ "$status" == "200" && "$live_sha" == "$GITHUB_SHA" ]]; then break; fi
            sleep 10
          done
          echo "Railway /api/health -> HTTP $status sha=${live_sha:-unknown}"
          if [[ "$status" != "200" || "$live_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Railway did not reach the release SHA before the public cutover." >&2
            cat /tmp/railway-health.json >&2 || true
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"

      - name: Verify public Railway-primary routing
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=000
          live_sha=''
          for _ in $(seq 1 30); do
            status="$(curl -sS -D /tmp/public-headers.txt -o /tmp/health.json -w '%{http_code}' --max-time 20 "${PUBLIC_SITE_URL%/}/api/health" || true)"
            live_sha="$(jq -r '.build.sha // empty' /tmp/health.json 2>/dev/null || true)"
            if [[ "$status" == "200" && "$live_sha" == "$GITHUB_SHA" ]] && grep -qi '^x-buildmybot-origin: railway' /tmp/public-headers.txt; then
              break
            fi
            sleep 10
          done
          echo "GET ${PUBLIC_SITE_URL%/}/api/health -> HTTP $status sha=${live_sha:-unknown}"
          cat /tmp/health.json || true
          if [[ "$status" != "200" ]]; then
            echo "::error::Public health did not return HTTP 200." >&2
            exit 1
          fi
          if [[ "$live_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Public domain is not serving the release SHA." >&2
            exit 1
          fi
          if ! grep -qi '^x-buildmybot-origin: railway' /tmp/public-headers.txt; then
            echo "::error::Public traffic is not using Railway as primary origin." >&2
            exit 1
          fi
          voice_status="$(curl -sS -o /tmp/voice-agent.html -w '%{http_code}' --max-time 20 "${PUBLIC_SITE_URL%/}/voice-agent")"
          [[ "$voice_status" == "200" ]] || { echo "::error::Voice-agent page returned HTTP $voice_status." >&2; exit 1; }
          {
            echo "### BuildMyBot public release verified"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Railway primary: HTTP 200"
            echo "- Public /api/health: HTTP 200"
            echo "- Voice page: HTTP 200"
          } >> "$GITHUB_STEP_SUMMARY"
