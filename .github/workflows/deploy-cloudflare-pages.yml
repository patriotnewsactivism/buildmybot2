name: Deploy BuildMyBot Frontend to Cloudflare Pages

# Why this workflow exists (2026-08-30)
#
# DEPLOYMENT.md documents the Pages project as auto-deploying from
# patriotnewsactivism/buildmybot2@main, but production drifted badly behind
# the branch: www.buildmybot.app was serving an older bundle than the one
# `npm run build` produces on main, and its /api/* route still resolved to
# the retired Railway app, answering
#   {"status":"error","code":404,"message":"Application not found"}
# for every request — including /api/cron/*, which is how the AI employees
# are driven. The Pages Function that proxies /api/* to Cloud Run
# (functions/api/[[path]].ts) has been committed on main the whole time; it
# had simply never reached a production Pages deployment.
#
# Relying on Cloudflare's git integration left no signal when it stopped
# firing. This makes the frontend release explicit, versioned with the
# commit, and verified against the live domain afterwards.
#
# OPT-IN: the deploy is skipped (not failed) unless all three of
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_PAGES_PROJECT
# are configured, so this cannot break CI before those are set. The token
# needs the "Cloudflare Pages — Edit" permission.

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
      - 'hooks/**'
      - 'functions/**'
      - 'public/**'
      - 'App.tsx'
      - 'index.tsx'
      - 'index.html'
      - 'constants.ts'
      - 'types.ts'
      - 'vite.config.ts'
      - '_headers'
      - '_redirects'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildmybot2-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || secrets.CLOUDFLARE_PAGES_PROJECT }}
      PUBLIC_SITE_URL: ${{ vars.BUILDMYBOT_PUBLIC_URL || 'https://www.buildmybot.app' }}

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether Cloudflare is configured
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "${PAGES_PROJECT:-}" ]] || missing+=(CLOUDFLARE_PAGES_PROJECT)

          if (( ${#missing[@]} )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Cloudflare Pages deploy skipped"
              echo
              echo "Not configured: \`${missing[*]}\`."
              echo
              echo "Until these are set, the frontend still deploys only through"
              echo "Cloudflare's own git integration, and \`/api/*\` on the public"
              echo "domain keeps whatever route it has today."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Skipping: ${missing[*]} not configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.configured == 'true'
        run: npm ci

      - name: Build frontend
        if: steps.gate.outputs.configured == 'true'
        env:
          # Baked into the bundle at build time, so a change here needs a
          # redeploy to take effect. VITE_API_URL is deliberately empty:
          # the browser calls same-origin /api/*, which the Pages Function
          # forwards to Cloud Run.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_API_URL: ''
        run: npm run build

      - name: Confirm Pages assets are in the build output
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # _headers/_redirects are served from the uploaded output directory,
          # while functions/ is compiled from the repo root. A silent loss of
          # either is what produces a "deployed but behaving like the old
          # build" Pages release, so fail loudly instead.
          for f in dist/_headers dist/_redirects dist/index.html; do
            [[ -f "$f" ]] || { echo "Missing $f in build output." >&2; exit 1; }
          done
          [[ -f 'functions/api/[[path]].ts' ]] || {
            echo 'Missing functions/api/[[path]].ts — /api/* would not reach Cloud Run.' >&2
            exit 1
          }
          echo 'Build output contains _headers, _redirects and the API Pages Function.'

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # `wrangler pages deploy <dir>` uploads <dir> as the static output and
          # compiles ./functions from the working directory into the Pages
          # Function bundle. --branch=main targets the production deployment.
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$(git log -1 --pretty=%s)"

      - name: Verify the public domain now reaches Cloud Run
        if: steps.gate.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Pages purges asynchronously, so poll rather than asserting once.
          status=000
          body=''
          for _ in $(seq 1 20); do
            status="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 \
              "${PUBLIC_SITE_URL%/}/api/health" || echo 000)"
            body="$(cat /tmp/health.json 2>/dev/null || true)"
            if [[ "$status" == "200" ]] && grep -q '"service"' <<<"$body"; then
              break
            fi
            sleep 15
          done

          echo "GET ${PUBLIC_SITE_URL%/}/api/health -> HTTP $status"
          echo "$body"

          # The exact failure this workflow exists to eliminate. Railway's edge
          # answers unknown hostnames with this shape; seeing it again means
          # /api/* is still routed away from Cloud Run somewhere ahead of Pages
          # (a Worker route or a DNS record), which a Pages deploy cannot fix.
          if grep -q 'Application not found' <<<"$body"; then
            echo "::error::/api/* is still served by the retired Railway app. A route ahead of Pages is intercepting it." >&2
            exit 1
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error::Expected HTTP 200 from /api/health, got $status." >&2
            exit 1
          fi

          {
            echo "### BuildMyBot frontend deployed"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Public health: HTTP $status"
            echo "- \`/api/*\` is served by Cloud Run."
          } >> "$GITHUB_STEP_SUMMARY"
