name: Apply realtime voice UI patch

on:
  push:
    branches:
      - feat/realtime-gemini-twilio-voice

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply UI patch
        run: node scripts/patch-realtime-voice-ui.mjs

      - name: Format changed source
        run: >-
          npx --no-install biome check --write
          types.ts
          components/PhoneAgent/PhoneAgent.tsx
          server.ts
          api/twilio/inbound.ts
          api/voice/twilio-live.ts

      - name: Remove one-time patch scaffolding
        run: rm scripts/patch-realtime-voice-ui.mjs .github/workflows/apply-realtime-voice-ui.yml

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Configure realtime voice actions in customer console"
          git push
