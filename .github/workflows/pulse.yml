name: AI Team — Pulse (around-the-clock persistence)

# Runs /api/cron/pulse every 10 minutes. The pulse is deliberately cheap:
# an idle run is a handful of Supabase reads and ZERO LLM calls. It only
# spends tokens when there's real work:
#   - overdue leads (48h+ no follow-up) -> dispatches lead-followups NOW
#     instead of waiting for its 3-hour slot
#   - unread internal agent mail -> the recipient role answers it (tight,
#     budgeted LLM call; "Re:" threads are never auto-answered, capping
#     every thread at one round trip)
#   - open CRITICAL errors older than 2h -> one Discord+Slack reminder each
#
# Scheduled here (not only vercel.json crons) because GitHub Actions runs
# regardless of Vercel plan tier, same pattern as ai-team-schedule.yml.
# GitHub cron timing is best-effort (runs can be a few minutes late under
# load) — fine for a persistence heartbeat.

on:
  workflow_dispatch: {} # manual "Run workflow" from the Actions tab
  # schedule DISABLED 2026-07-24: this worker (and its indirect dispatch of
  # lead-followups/sales-outreach) places real Twilio calls and sends real
  # emails to real leads. Paused pending the safety-gate work in
  # api/ai-team/lib.ts (SALES_AUTOMATION_DRY_RUN + AI_TEAM_KILL_SWITCH) and a
  # verified dry-run pass. Re-enable deliberately once that's confirmed:
  # schedule:
  #   - cron: '*/10 * * * *'

# Server-to-server calls target the Cloud Run backend directly rather than the
# public domain. www.buildmybot.app is fronted by Cloudflare, whose /api/*
# route still resolves to the retired Railway app and answers every request
# with {"code":404,"message":"Application not found"} — so every shift pointed
# at the public host failed before reaching the backend. Cloud Run is the
# authoritative origin and is verified healthy by the deploy workflow.
#
# Set the BUILDMYBOT_API_ORIGIN repository variable to move these jobs back to
# https://www.buildmybot.app once that Cloudflare route is repaired; no code
# change is needed.
env:
  API_ORIGIN: ${{ vars.BUILDMYBOT_API_ORIGIN || 'https://buildmybot2-fq5disxp2a-uc.a.run.app' }}

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Run pulse
        run: |
          curl -sf -X POST "$API_ORIGIN/api/cron/pulse" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" || echo "::warning::pulse call failed (non-fatal, next pulse in 10 minutes)"
