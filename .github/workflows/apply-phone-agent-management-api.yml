name: Inspect BuildMyBot phone activation data

on:
  push:
    branches: [feat/phone-agent-activation]
    paths:
      - '.github/workflows/apply-phone-agent-management-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: evkjlnbpntimbxklnhoz
    steps:
      - name: Verify exact BuildMyBot project and inspect safe counts
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || exit 2
          status="$(curl -sS -o /tmp/project.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF")"
          [[ "$status" == "200" ]] || exit 3
          [[ "$(jq -r '.ref // .id // empty' /tmp/project.json)" == "$PROJECT_REF" ]] || exit 4

          read -r -d '' SQL <<'SQL' || true
          SELECT json_build_object(
            'phone_rows', (SELECT count(*) FROM public.phone_numbers),
            'telephony_rows', (SELECT count(*) FROM public.telephony_accounts),
            'activation_rows', (SELECT count(*) FROM public.phone_agent_activations),
            'provider_account_populated', (SELECT count(*) FROM public.phone_numbers WHERE provider_account_sid IS NOT NULL),
            'setup_mode_populated', (SELECT count(*) FROM public.phone_numbers WHERE setup_mode IS NOT NULL),
            'source_number_populated', (SELECT count(*) FROM public.phone_numbers WHERE source_number IS NOT NULL),
            'activation_status_nondefault', (SELECT count(*) FROM public.phone_numbers WHERE activation_status IS DISTINCT FROM 'active'),
            'twilio_subaccount_populated', (SELECT count(*) FROM public.phone_numbers WHERE twilio_subaccount_sid IS NOT NULL),
            'knowledge_space_populated', (SELECT count(*) FROM public.phone_numbers WHERE knowledge_space_id IS NOT NULL),
            'telephony_rls', (SELECT relrowsecurity FROM pg_class WHERE oid='public.telephony_accounts'::regclass),
            'activations_rls', (SELECT relrowsecurity FROM pg_class WHERE oid='public.phone_agent_activations'::regclass),
            'knowledge_spaces_exists', to_regclass('public.knowledge_spaces') IS NOT NULL
          ) AS snapshot;
          SQL
          jq -n --arg query "$SQL" '{query:$query,read_only:true}' > /tmp/query.json
          status="$(curl -sS -o /tmp/result.json -w '%{http_code}' --max-time 30 \
            -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query/read-only")"
          [[ "$status" == "201" ]] || { cat /tmp/result.json >&2; exit 5; }
          jq '.' /tmp/result.json
