name: Inspect BuildMyBot phone schema

on:
  push:
    branches: [feat/phone-agent-activation]
    paths:
      - '.github/workflows/apply-phone-agent-management-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: evkjlnbpntimbxklnhoz
    steps:
      - name: Verify exact BuildMyBot project
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || exit 2
          status="$(curl -sS -o /tmp/project.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF")"
          [[ "$status" == "200" ]] || { cat /tmp/project.json >&2; exit 3; }
          actual_ref="$(jq -r '.ref // .id // empty' /tmp/project.json)"
          [[ "$actual_ref" == "$PROJECT_REF" ]] || exit 4
      - name: Inspect live schema using read-only Management API query
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' SQL <<'SQL' || true
          SELECT json_build_object(
            'columns', (
              SELECT json_agg(json_build_object(
                'table', table_name,
                'column', column_name,
                'data_type', data_type,
                'udt_name', udt_name,
                'nullable', is_nullable
              ) ORDER BY table_name, ordinal_position)
              FROM information_schema.columns
              WHERE table_schema='public'
                AND table_name IN ('phone_numbers','bots','voice_agents','knowledge_sources','knowledge_chunks','telephony_accounts','phone_agent_activations')
            ),
            'phone_indexes', (
              SELECT json_agg(indexdef ORDER BY indexname)
              FROM pg_indexes
              WHERE schemaname='public' AND tablename='phone_numbers'
            ),
            'phone_constraints', (
              SELECT json_agg(json_build_object('name', c.conname, 'definition', pg_get_constraintdef(c.oid)) ORDER BY c.conname)
              FROM pg_constraint c
              JOIN pg_class t ON t.oid=c.conrelid
              JOIN pg_namespace n ON n.oid=t.relnamespace
              WHERE n.nspname='public' AND t.relname='phone_numbers'
            )
          ) AS schema_snapshot;
          SQL
          jq -n --arg query "$SQL" '{query:$query,read_only:true}' > /tmp/query.json
          status="$(curl -sS -o /tmp/schema.json -w '%{http_code}' --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/query.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query/read-only")"
          if [[ "$status" != "201" ]]; then
            echo "Schema inspection failed HTTP $status" >&2
            cat /tmp/schema.json >&2 || true
            exit 5
          fi
          jq '.' /tmp/schema.json
