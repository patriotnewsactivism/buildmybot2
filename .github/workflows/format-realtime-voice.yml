name: Capture realtime voice lint diagnostics

on:
  push:
    branches:
      - feat/realtime-gemini-twilio-voice

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture Biome diagnostics
        shell: bash
        run: |
          set +e
          npx --no-install biome check --diagnostic-level=error --max-diagnostics=100 -- \
            api/twilio/inbound.ts \
            api/voice/twilio-live.ts \
            components/PhoneAgent/PhoneAgent.tsx \
            server.ts \
            test/realtime-voice-bridge.test.ts \
            types.ts > biome-realtime-voice-diagnostics.txt 2>&1
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biome-realtime-voice-diagnostics.txt
          git commit -m "Capture realtime voice lint diagnostics"
          git push
