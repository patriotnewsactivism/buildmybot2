name: Format realtime voice source

on:
  push:
    branches:
      - feat/realtime-gemini-twilio-voice

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Biome fixes
        run: >-
          npx --no-install biome check --write
          api/twilio/inbound.ts
          api/voice/twilio-live.ts
          components/PhoneAgent/PhoneAgent.tsx
          server.ts
          test/realtime-voice-bridge.test.ts
          types.ts
      - name: Remove one-time workflow
        run: rm .github/workflows/format-realtime-voice.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format realtime voice bridge changes"
          git push
