name: Finalize Tavily Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-tavily-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: buildmybot2-finalize-tavily-runtime
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: buildmybot-507112
  GCP_REGION: us-central1
  GCP_SERVICE: buildmybot2
  EXPECTED_GCP_SERVICE_ACCOUNT: buildmybotsa@buildmybot-507112.iam.gserviceaccount.com
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/406797137160/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  RUNTIME_SERVICE_ACCOUNT: 406797137160-compute@developer.gserviceaccount.com
  TAVILY_SECRET: buildmybot-tavily-api-key

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.EXPECTED_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Grant runtime access and attach Tavily secret
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets describe "$TAVILY_SECRET" --project "$GCP_PROJECT_ID" >/dev/null
          gcloud secrets add-iam-policy-binding "$TAVILY_SECRET" \
            --project "$GCP_PROJECT_ID" \
            --member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            --role roles/secretmanager.secretAccessor \
            --quiet >/dev/null

          gcloud run services update "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --update-secrets TAVILY_API_KEY=${TAVILY_SECRET}:latest \
            --quiet >/dev/null

      - name: Verify Cloud Run binding
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$GCP_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json >/tmp/service.json
          python3 - <<'PY'
          import json
          service=json.load(open('/tmp/service.json'))
          env=service['spec']['template']['spec']['containers'][0].get('env',[])
          item=next((x for x in env if x.get('name')=='TAVILY_API_KEY'), None)
          if not item or not item.get('valueFrom'):
              raise SystemExit('TAVILY_API_KEY is not Secret Manager-backed on Cloud Run')
          print('BuildMyBot2 TAVILY_API_KEY is Secret Manager-backed on Cloud Run.')
          PY

      - name: Verify live Tavily Search from stored production secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            rm -f /tmp/tavily.key
            gcloud secrets remove-iam-policy-binding "$TAVILY_SECRET" \
              --project "$GCP_PROJECT_ID" \
              --member "serviceAccount:${EXPECTED_GCP_SERVICE_ACCOUNT}" \
              --role roles/secretmanager.secretAccessor \
              --quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          gcloud secrets add-iam-policy-binding "$TAVILY_SECRET" \
            --project "$GCP_PROJECT_ID" \
            --member "serviceAccount:${EXPECTED_GCP_SERVICE_ACCOUNT}" \
            --role roles/secretmanager.secretAccessor \
            --quiet >/dev/null
          gcloud secrets versions access latest \
            --secret "$TAVILY_SECRET" \
            --project "$GCP_PROJECT_ID" >/tmp/tavily.key

          python3 - <<'PY'
          import json, urllib.request
          key = open('/tmp/tavily.key', encoding='utf-8').read().strip()
          req = urllib.request.Request(
              'https://api.tavily.com/search',
              data=json.dumps({
                  'query': 'Tavily Search API',
                  'search_depth': 'basic',
                  'max_results': 1,
              }).encode(),
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': f'Bearer {key}',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f'Tavily smoke test returned HTTP {response.status}')
              payload = json.load(response)
              if not isinstance(payload.get('results'), list):
                  raise SystemExit('Tavily smoke test response did not contain results')
          print('BuildMyBot2 stored production Tavily credential passed a live Search request.')
          PY
