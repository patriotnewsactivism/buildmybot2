name: Supabase Migration Baseline Audit

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BASELINE_AUDIT to inspect production migration state
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      MIGRATION_CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4

      - name: Require explicit audit confirmation
        run: test "$MIGRATION_CONFIRM" = "BASELINE_AUDIT"

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Inspect linked migration history only
        run: supabase migration list --linked

      - name: Production migration hold
        run: |
          echo "Production db push is intentionally disabled."
          echo "The live BuildMyBot database already contains application relations but did not expose a Supabase CLI migration-history table during the 2026-09-05 release audit."
          echo "Reconcile and baseline migration history before re-enabling any supabase db push command."
          echo "See docs/MIGRATION_BASELINE_RECONCILIATION.md."
