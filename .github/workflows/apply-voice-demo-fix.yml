name: Apply voice demo fix

on:
  push:
    branches:
      - fix/voice-agent-demo-limits

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch reliable limited public demo
        shell: python
        run: |
          from pathlib import Path

          path = Path('components/VoiceAgent/VoiceAgentPage.tsx')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              """interface LiveTokenResponse {
            token?: string;
            model?: string;
            error?: string;
          }""",
              """interface LiveTokenResponse {
            token?: string;
            model?: string;
            voice?: string;
            maxDurationSeconds?: number;
            maxTurns?: number;
            expiresAt?: string;
            error?: string;
          }""",
              'token response type',
          )

          replace_once(
              """  const nextPlaybackTimeRef = useRef(0);
            const mountedRef = useRef(true);""",
              """  const nextPlaybackTimeRef = useRef(0);
            const mountedRef = useRef(true);
            const demoTimeoutRef = useRef<number | null>(null);""",
              'demo timeout ref',
          )

          replace_once(
              """      clearPlayback();

              if (socketRef.current) {""",
              """      clearPlayback();
              if (demoTimeoutRef.current !== null) {
                window.clearTimeout(demoTimeoutRef.current);
                demoTimeoutRef.current = null;
              }

              if (socketRef.current) {""",
              'clear demo timeout',
          )

          replace_once(
              """      if (message.setupComplete) {
                await startMicrophone();
                setCallState('listening');
                setStatus('Listening — speak naturally');
                return;
              }""",
              """      if (message.setupComplete) {
                await startMicrophone();
                setCallState('listening');
                setStatus('Connected — your AI receptionist is greeting you');

                const socket = socketRef.current;
                if (socket?.readyState === WebSocket.OPEN) {
                  socket.send(
                    JSON.stringify({
                      clientContent: {
                        turns: [
                          {
                            role: 'user',
                            parts: [
                              {
                                text: 'The visitor just started the BuildMyBot public voice demo. Greet them now in one short, warm, natural sentence as a premium business receptionist. Then ask what kind of business they run or what they would like their receptionist to help with. Do not explain that this greeting was prompted.',
                              },
                            ],
                          },
                        ],
                        turnComplete: true,
                      },
                    }),
                  );
                }
                return;
              }""",
              'automatic greeting',
          )

          replace_once(
              """    if (!navigator.mediaDevices?.getUserMedia || !window.AudioContext) {
              setCallState('error');
              setErrorMessage(
                'Live voice requires a modern browser with microphone access.',
              );
              return;
            }

            setCallState('connecting');
            setStatus('Securing a Gemini Live session');""",
              """    const AudioContextClass =
              window.AudioContext ||
              (
                window as typeof window & {
                  webkitAudioContext?: typeof AudioContext;
                }
              ).webkitAudioContext;

            if (!navigator.mediaDevices?.getUserMedia || !AudioContextClass) {
              setCallState('error');
              setErrorMessage(
                'Live voice requires a modern browser with microphone access.',
              );
              return;
            }

            setCallState('connecting');
            setStatus('Starting your limited live demo');""",
              'mobile audio compatibility',
          )

          replace_once(
              """    try {
              const tokenResponse = await fetch('/api/voice/live-token', {""",
              """    try {
              // Resume the browser audio engine from the visitor's original tap.
              // Mobile browsers can block playback if AudioContext is created only
              // after an asynchronous token request has completed.
              const audioContext = new AudioContextClass({ latencyHint: 'interactive' });
              audioContextRef.current = audioContext;
              nextPlaybackTimeRef.current = audioContext.currentTime;
              await audioContext.resume();

              const tokenResponse = await fetch('/api/voice/live-token', {""",
              'activate audio before token request',
          )

          replace_once(
              """      const audioContext = new AudioContext({ latencyHint: 'interactive' });
              await audioContext.resume();
              audioContextRef.current = audioContext;
              nextPlaybackTimeRef.current = audioContext.currentTime;

              const url = `${GEMINI_LIVE_URL}?access_token=${encodeURIComponent(tokenPayload.token)}`;""",
              """      const demoSeconds = Math.min(
                90,
                Math.max(15, tokenPayload.maxDurationSeconds || 90),
              );
              demoTimeoutRef.current = window.setTimeout(() => {
                endConversation('idle');
                setStatus('Demo complete — start free to build your own');
              }, demoSeconds * 1000);

              const url = `${GEMINI_LIVE_URL}?access_token=${encodeURIComponent(tokenPayload.token)}`;""",
              'client hard-stop timer',
          )

          replace_once(
              """              <p className=\"mt-4 text-center text-xs leading-5 text-slate-500\">
                          Your browser will request microphone access. The public demo is
                          conversational only; production customer agents can be wired to
                          approved tools, routing, CRM, and scheduling actions.
                        </p>""",
              """              <div className=\"mt-4 flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold text-slate-400\">
                          <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                            90-second max
                          </span>
                          <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                            About 6 exchanges
                          </span>
                          <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                            Rate limited
                          </span>
                        </div>
                        <p className=\"mt-3 text-center text-xs leading-5 text-slate-500\">
                          This is a real two-way Gemini Live conversation, not a recording.
                          The public showcase is intentionally short; customer agents can
                          run continuously with approved tools, routing, CRM, and scheduling.
                        </p>""",
              'visible demo limits',
          )

          path.write_text(text)

          for temporary in [
              Path('.github/workflows/diagnose-public-voice-demo.yml'),
              Path('.github/workflows/apply-voice-demo-fix.yml'),
          ]:
              if temporary.exists():
                  temporary.unlink()
      - name: Install and format
        run: |
          npm ci
          npx --no-install biome check --write components/VoiceAgent/VoiceAgentPage.tsx
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix reliable limited public voice demo"
          git push
