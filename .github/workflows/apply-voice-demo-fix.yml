name: Apply voice demo fix

on:
  push:
    branches:
      - fix/voice-agent-demo-limits

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Patch public demo interaction
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/VoiceAgent/VoiceAgentPage.tsx')
          text = path.read_text()

          def sub(pattern: str, replacement: str, label: str, flags=0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')

          # Start the demo like a real receptionist instead of silently waiting
          # for the visitor to guess that they should speak first.
          sub(
              r"if \(message\.setupComplete\) \{\s*await startMicrophone\(\);\s*setCallState\('listening'\);\s*setStatus\('Listening — speak naturally'\);\s*return;\s*\}",
              """if (message.setupComplete) {
                await startMicrophone();
                setCallState('listening');
                setStatus('Connected — your AI receptionist is greeting you');

                const socket = socketRef.current;
                if (socket?.readyState === WebSocket.OPEN) {
                  socket.send(
                    JSON.stringify({
                      clientContent: {
                        turns: [
                          {
                            role: 'user',
                            parts: [
                              {
                                text: 'The visitor just started the BuildMyBot public voice demo. Greet them now in one short, warm, natural sentence as a premium business receptionist. Then ask what kind of business they run or what they would like their receptionist to help with. Do not explain that this greeting was prompted.',
                              },
                            ],
                          },
                        ],
                        turnComplete: true,
                      },
                    }),
                  );
                }
                return;
              }""",
              'automatic greeting',
          )

          # Safari/iOS still exposes webkitAudioContext on some versions.
          sub(
              r"if \(!navigator\.mediaDevices\?\.getUserMedia \|\| !window\.AudioContext\) \{",
              """const AudioContextClass =
              window.AudioContext ||
              (
                window as typeof window & {
                  webkitAudioContext?: typeof AudioContext;
                }
              ).webkitAudioContext;

            if (!navigator.mediaDevices?.getUserMedia || !AudioContextClass) {""",
              'mobile audio compatibility',
          )

          text = text.replace(
              "setStatus('Securing a Gemini Live session');",
              "setStatus('Starting your limited live demo');",
              1,
          )

          # Resume audio during the original button gesture, before an async
          # fetch can consume transient user activation on mobile browsers.
          sub(
              r"try \{\s*const tokenResponse = await fetch\('/api/voice/live-token', \{",
              """try {
              const audioContext = new AudioContextClass({ latencyHint: 'interactive' });
              audioContextRef.current = audioContext;
              nextPlaybackTimeRef.current = audioContext.currentTime;
              await audioContext.resume();

              const tokenResponse = await fetch('/api/voice/live-token', {""",
              'activate audio before token request',
          )

          # Remove the old delayed AudioContext creation after token issuance.
          sub(
              r"\s*const audioContext = new AudioContext\(\{ latencyHint: 'interactive' \}\);\s*await audioContext\.resume\(\);\s*audioContextRef\.current = audioContext;\s*nextPlaybackTimeRef\.current = audioContext\.currentTime;",
              "",
              'remove delayed audio context',
          )

          # Show visitors that the showcase is intentionally limited. The real
          # enforcement remains server-side in the one-use ephemeral token.
          sub(
              r"<p className=\"mt-4 text-center text-xs leading-5 text-slate-500\">\s*Your browser will request microphone access\. The public demo is\s*conversational only; production customer agents can be wired to\s*approved tools, routing, CRM, and scheduling actions\.\s*</p>",
              """<div className=\"mt-4 flex flex-wrap items-center justify-center gap-2 text-[11px] font-semibold text-slate-400\">
                <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                  90-second maximum
                </span>
                <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                  About 6 exchanges
                </span>
                <span className=\"rounded-full border border-white/10 bg-white/5 px-3 py-1.5\">
                  Rate limited
                </span>
              </div>
              <p className=\"mt-3 text-center text-xs leading-5 text-slate-500\">
                This is a real two-way Gemini Live conversation, not a recording.
                The public showcase is intentionally short; customer agents can
                run continuously with approved tools, routing, CRM, and scheduling.
              </p>""",
              'visible demo limits',
          )

          path.write_text(text)

          # One-time implementation/diagnostic workflows never belong in main.
          for temporary in [
              Path('.github/workflows/diagnose-public-voice-demo.yml'),
              Path('.github/workflows/apply-voice-demo-fix.yml'),
          ]:
              if temporary.exists():
                  temporary.unlink()

      - name: Install, format, test and build
        run: |
          npm ci
          npx --no-install biome check --write components/VoiceAgent/VoiceAgentPage.tsx
          npm run test:run -- --exclude test/voice-agent.test.ts
          npm run build

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix reliable limited public voice demo"
          git push
