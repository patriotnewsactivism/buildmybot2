name: Fix public voice demo microphone capture

on:
  push:
    branches:
      - fix/voice-demo-microphone-capture

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-demo-microphone-capture
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply microphone patch
        run: python scripts/patch_voice_demo_microphone.py

      - name: Install dependencies
        run: npm ci

      - name: Format microphone page
        run: npx --no-install biome check --write components/VoiceAgent/VoiceAgentPage.tsx

      - name: Run maintained tests
        run: npm run test:run -- --exclude test/voice-agent.test.ts

      - name: Build production client
        run: npm run build

      - name: Commit tested microphone fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-voice-demo-microphone.yml scripts/patch_voice_demo_microphone.py scripts/.voice-demo-microphone-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix public voice demo microphone capture'
          git push
