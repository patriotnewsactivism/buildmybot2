name: Fix public voice demo microphone capture

on:
  push:
    branches: [fix/voice-demo-microphone-capture]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voice-demo-microphone-capture
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch microphone capture onto the user gesture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/VoiceAgent/VoiceAgentPage.tsx')
          text = path.read_text()

          pattern = re.compile(
              r"    const stream = await navigator\.mediaDevices\.getUserMedia\(\{\n"
              r"      audio: \{\n"
              r"        channelCount: 1,\n"
              r"        echoCancellation: true,\n"
              r"        noiseSuppression: true,\n"
              r"        autoGainControl: true,\n"
              r"      \},\n"
              r"    \}\);\n"
              r"    streamRef\.current = stream;",
              re.MULTILINE,
          )

          replacement = """    const existingStream = streamRef.current;
              const hasLiveAudioTrack = existingStream
                ?.getAudioTracks()
                .some((track) => track.readyState === 'live');
              const stream = hasLiveAudioTrack
                ? existingStream
                : await navigator.mediaDevices.getUserMedia({
                    audio: {
                      channelCount: 1,
                      echoCancellation: true,
                      noiseSuppression: true,
                      autoGainControl: true,
                    },
                  });

              if (!stream) {
                throw new Error('No microphone stream is available.');
              }

              streamRef.current = stream;
              const audioTracks = stream.getAudioTracks();
              if (!audioTracks.length) {
                throw new Error('No microphone was found on this device.');
              }
              for (const track of audioTracks) {
                track.enabled = true;
              }"""

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'getUserMedia block replacement count={count}')

          marker = "      await audioContext.resume();\n"
          if marker not in text:
              raise SystemExit('audioContext.resume marker not found')

          early_capture = marker + """

              // Open the microphone from the original button tap before any
              // network I/O. This keeps mobile browsers from leaving Gemini
              // connected while the microphone capture never actually starts.
              setStatus('Requesting microphone access');
              const microphoneStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                  channelCount: 1,
                  echoCancellation: true,
                  noiseSuppression: true,
                  autoGainControl: true,
                },
              });
              const microphoneTracks = microphoneStream.getAudioTracks();
              if (!microphoneTracks.length) {
                for (const track of microphoneStream.getTracks()) track.stop();
                throw new Error('No microphone was found on this device.');
              }
              for (const track of microphoneTracks) {
                track.enabled = true;
              }
              streamRef.current = microphoneStream;
              setStatus('Microphone ready — connecting to Gemini Live');
"""
          text = text.replace(marker, early_capture, 1)

          path.write_text(text)
          PY

      - run: npm ci
      - run: npx --no-install biome check --write components/VoiceAgent/VoiceAgentPage.tsx
      - run: npm run test:run -- --exclude test/voice-agent.test.ts
      - run: npm run build

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/fix-voice-demo-microphone.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix public voice demo microphone capture'
          git push
