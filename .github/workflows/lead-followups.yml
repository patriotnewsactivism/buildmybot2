name: Lead Follow-Up

# Native Vercel port of the old Base44 "Lead Follow-Up" workflow (which kept
# getting cancelled once Base44 integration credits ran out). Runs every 3h,
# free, no credit ceiling. See /api/cron/lead-followups.ts for the logic.

on:
  workflow_dispatch: {}
  # schedule DISABLED 2026-07-24: sends real follow-up emails to real leads.
  # Paused pending the SALES_AUTOMATION_DRY_RUN safety gate and a verified
  # dry-run pass. Re-enable deliberately once that's confirmed:
  # schedule:
  #   - cron: '0 */3 * * *' # every 3 hours

# Server-to-server calls target the Cloud Run backend directly rather than the
# public domain. www.buildmybot.app is fronted by Cloudflare, whose /api/*
# route still resolves to the retired Railway app and answers every request
# with {"code":404,"message":"Application not found"} — so every shift pointed
# at the public host failed before reaching the backend. Cloud Run is the
# authoritative origin and is verified healthy by the deploy workflow.
#
# Set the BUILDMYBOT_API_ORIGIN repository variable to move these jobs back to
# https://www.buildmybot.app once that Cloudflare route is repaired; no code
# change is needed.
env:
  API_ORIGIN: ${{ vars.BUILDMYBOT_API_ORIGIN || 'https://buildmybot2-fq5disxp2a-uc.a.run.app' }}

jobs:
  follow-up:
    runs-on: ubuntu-latest
    steps:
      - name: Send follow-ups to stale leads
        run: |
          curl -sf -X POST "$API_ORIGIN/api/cron/lead-followups" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n" || echo "::warning::lead-followups call failed (non-fatal, will retry next cycle)"
