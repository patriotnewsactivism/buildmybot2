name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
        # Gated 2026-07-10: biome exits 0 with 223 pre-existing warnings (no errors).
        # This blocks NEW lint errors from merging while accepting existing warning debt.

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build
