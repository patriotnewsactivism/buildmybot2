name: AI Team — Recurring Shifts

# Replaces the old Base44 cron workflows entirely — this repo owns its own
# scheduling now, free of any Base44 integration-credit ceiling.
#
# Two cadence tiers so the team feels genuinely "always on" instead of
# checking in once a day:
#  - Tier A (customer/revenue-facing, has real live data to react to):
#    sam-support, sales-agents, derek-sales-director, victoria-vp-sales,
#    maya-marketing -> every 3 hours, 5x/day.
#  - Tier B (internal/ops functions, still valuable but less time-sensitive,
#    some still honest placeholders with no live data source yet):
#    eli-engineering, oscar-operations, piper-product, hr-associate,
#    billing-associate, hannah-hr, brianna-billing -> every ~4 hours, 3x/day.
#  - Marcus (executive rollup) -> 2x/day (midday + evening) instead of once,
#    so Don gets a fresher picture without waiting for end of day.
#
# Times below are America/Chicago, converted to UTC assuming CDT (summer,
# UTC-5) — shift by an hour in winter (CST, UTC-6) if exact timing matters.
# github.event.schedule tells us exactly which entry fired, so there's no
# flaky wall-clock matching, even with entries at the same clock time.

on:
  workflow_dispatch: {} # manual "Run workflow" from the Actions tab -> runs Marcus's rollup
  schedule:
    # --- Tier A: every 3h, 8am/11am/2pm/5pm/8pm CDT ---
    - cron: '0 13 * * *' # 8:00 AM CDT
    - cron: '0 16 * * *' # 11:00 AM CDT
    - cron: '0 19 * * *' # 2:00 PM CDT
    - cron: '0 22 * * *' # 5:00 PM CDT
    - cron: '0 1 * * *'  # 8:00 PM CDT

    # --- Tier B: every ~4h, 9:30am/1:30pm/5:30pm CDT (offset :30 to stay distinct) ---
    - cron: '30 14 * * *' # 9:30 AM CDT
    - cron: '30 18 * * *' # 1:30 PM CDT
    - cron: '30 22 * * *' # 5:30 PM CDT

    # --- Marcus: 2x/day, 2:15pm and 6:15pm CDT ---
    - cron: '15 19 * * *' # 2:15 PM CDT
    - cron: '15 23 * * *' # 6:15 PM CDT

jobs:
  run-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Map the cron that fired to its role(s)
        id: role
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          echo "fired cron: $SCHEDULE"
          case "$SCHEDULE" in
            "0 13 * * *"|"0 16 * * *"|"0 19 * * *"|"0 22 * * *"|"0 1 * * *")
              echo "roles=sam-support,sales-agents,derek-sales-director,victoria-vp-sales,maya-marketing" >> "$GITHUB_OUTPUT" ;;
            "30 14 * * *"|"30 18 * * *"|"30 22 * * *")
              echo "roles=eli-engineering,oscar-operations,piper-product,hr-associate,billing-associate,hannah-hr,brianna-billing" >> "$GITHUB_OUTPUT" ;;
            "15 19 * * *"|"15 23 * * *")
              echo "roles=marcus" >> "$GITHUB_OUTPUT" ;;
            *) echo "roles=marcus" >> "$GITHUB_OUTPUT" ;; # manual dispatch fallback
          esac

      - name: Call role endpoint(s)
        run: |
          IFS=',' read -ra ROLES <<< "${{ steps.role.outputs.roles }}"
          for ROLE in "${ROLES[@]}"; do
            echo "Running shift for: $ROLE"
            curl -sf -X POST "https://www.buildmybot.app/api/cron/all-shifts?role=$ROLE" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -w "\nHTTP %{http_code}\n" || echo "::warning::$ROLE call failed (non-fatal, logged for next run)"
          done
