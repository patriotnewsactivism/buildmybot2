name: AI Team — Recurring Shifts

# Replaces the old Base44 cron workflows entirely. Repo is public, so
# GitHub Actions minutes are free/unlimited -- the real ceilings are Groq's
# free-tier request budget (llama-3.3-70b-versatile: ~1,000 requests/day
# shared across every role) AND Tavily's free tier (~1,000 search credits
# PER MONTH, not per day -- only the research-mode roles below consume it).
# Cerebras is the automatic fallback (~1M tokens/day) if Groq ever gets
# rate-limited mid-day -- lib.ts already tries it before ever touching paid
# OpenAI.
#
#  - Sales leadership (derek-sales-director, victoria-vp-sales): reasoning
#    only, no Tavily cost -> every 10 minutes, all day.
#    144 runs/day x 2 roles = 288 calls/day.
#  - Sarah Collins (Lead Researcher): every 20 minutes -> 72 runs/day =
#    72 Tavily credits/day.
#  - Sales Agent Researchers (Charles Hudson, Brian Walsh, Kevin Prescott,
#    Nathan Doyle, Ryan Fletcher): pre-launch, all 5 building the lead
#    database alongside Sarah instead of making calls yet (Don's direction,
#    2026-07-10) -> 3x/hour (offset from Sarah) = 72 runs/day EACH x 5 =
#    360 Tavily credits/day. Combined with Sarah: ~432 credits/day --
#    Don's explicit direction 2026-07-12: burn through the 1,000/month
#    free Tavily tier in ~2-3 days on purpose and rotate in a fresh API
#    key/account each time (Tavily's free tier is per-account, easy to
#    re-roll). Flip SALES_AGENTS_MODE=outreach (Vercel env var) once real
#    sales calls start -- these switch to normal lead-review shifts
#    instead, no redeploy needed.
#  - Tier A (sam-support, maya-marketing): real live data, less urgent than
#    sales -> every 1 hour. 24 runs/day x 2 roles = 48 calls/day.
#  - Tier B (eli-engineering, oscar-operations, piper-product, hr-associate,
#    billing-associate, hannah-hr, brianna-billing): internal/ops, some
#    still honest placeholders with no live data source yet -> every 2
#    hours. 12 runs/day x 7 roles = 84 calls/day.
#  - Marcus Stone (executive rollup): every 4 hours -> 6 calls/day.
#  - Frankie Mercer (Social Media Manager): reasons, drafts, and -- once
#    real platform API keys are set -- publishes/replies -> every 2 hours,
#    offset :10 past Tier B. 12 runs/day x 1 call = 12 calls/day.
#
# Total Groq/LLM calls: ~466 (non-research) + ~432 (research roles above,
# up from 28/day) = ~898/day. Still under Groq's 1,000/day free cap, but
# with much less headroom than before -- if Groq starts rate-limiting,
# callLLM automatically falls back to Cerebras (~1M tokens/day) per role,
# so shifts won't break, they'll just use the fallback provider.
#
# Times below are America/Chicago, converted to UTC assuming CDT (summer,
# UTC-5) -- shift by an hour in winter (CST, UTC-6) if exact timing matters.
# github.event.schedule tells us exactly which entry fired, so there's no
# flaky wall-clock matching, even when entries land on the same clock time.

on:
  workflow_dispatch: {} # manual "Run workflow" from the Actions tab -> runs Marcus Stone's rollup
  # schedule DISABLED 2026-07-24: the sales-research roles here feed
  # researched_leads, which sales-outreach/pulse then act on with real
  # emails and real Twilio calls. Paused pending the SALES_AUTOMATION_DRY_RUN
  # safety gate and a verified dry-run pass. Re-enable deliberately once
  # that's confirmed:
  # schedule:
  #   # --- Sales leadership: every 10 minutes, all day (reasoning only, no Tavily cost) ---
  #   - cron: '*/10 * * * *'
  #
  #   # --- Sarah Collins (Lead Researcher): every 20 minutes (burn-through-1000-in-2-3-days mode) ---
  #   - cron: '*/20 * * * *'
  #
  #   # --- Sales Agent Researchers (5, pre-launch): 3x/hour, offset from Sarah ---
  #   - cron: '10,30,50 * * * *'
  #
  #   # --- Tier A: every 1 hour ---
  #   - cron: '0 * * * *'
  #
  #   # --- Tier B: every 2 hours ---
  #   - cron: '0 */2 * * *'
  #
  #   # --- Marcus Stone: every 4 hours ---
  #   - cron: '30 */4 * * *'
  #
  #   # --- Frankie Mercer (Social Media Manager): every 2 hours ---
  #   - cron: '10 */2 * * *'

# Server-to-server calls target the Cloud Run backend directly rather than the
# public domain. www.buildmybot.app is fronted by Cloudflare, whose /api/*
# route still resolves to the retired Railway app and answers every request
# with {"code":404,"message":"Application not found"} — so every shift pointed
# at the public host failed before reaching the backend. Cloud Run is the
# authoritative origin and is verified healthy by the deploy workflow.
#
# Set the BUILDMYBOT_API_ORIGIN repository variable to move these jobs back to
# https://www.buildmybot.app once that Cloudflare route is repaired; no code
# change is needed.
env:
  API_ORIGIN: ${{ vars.BUILDMYBOT_API_ORIGIN || 'https://buildmybot2-fq5disxp2a-uc.a.run.app' }}

jobs:
  run-shift:
    runs-on: ubuntu-latest
    steps:
      - name: Map the cron that fired to its role(s)
        id: role
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          echo "fired cron: $SCHEDULE"
          case "$SCHEDULE" in
            "*/10 * * * *")
              echo "roles=derek-sales-director,victoria-vp-sales" >> "$GITHUB_OUTPUT" ;;
            "*/20 * * * *")
              echo "roles=lead-researcher" >> "$GITHUB_OUTPUT" ;;
            "10,30,50 * * * *")
              echo "roles=sales-agent-1,sales-agent-2,sales-agent-3,sales-agent-4,sales-agent-5" >> "$GITHUB_OUTPUT" ;;
            "0 * * * *")
              echo "roles=sam-support,maya-marketing" >> "$GITHUB_OUTPUT" ;;
            "0 */2 * * *")
              echo "roles=eli-engineering,oscar-operations,piper-product,hr-associate,billing-associate,hannah-hr,brianna-billing" >> "$GITHUB_OUTPUT" ;;
            "30 */4 * * *")
              echo "roles=marcus" >> "$GITHUB_OUTPUT" ;;
            "10 */2 * * *")
              echo "roles=frankie-social" >> "$GITHUB_OUTPUT" ;;
            *) echo "roles=marcus" >> "$GITHUB_OUTPUT" ;; # manual dispatch fallback
          esac

      - name: Call role endpoint(s)
        run: |
          IFS=',' read -ra ROLES <<< "${{ steps.role.outputs.roles }}"
          for ROLE in "${ROLES[@]}"; do
            echo "Running shift for: $ROLE"
            curl -sf -X POST "$API_ORIGIN/api/cron/all-shifts?role=$ROLE" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -w "\nHTTP %{http_code}\n" || echo "::warning::$ROLE call failed (non-fatal, logged for next run)"
          done
