name: Capture realtime voice test failure

on:
  push:
    branches:
      - feat/realtime-gemini-twilio-voice

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture maintained test output
        shell: bash
        run: |
          set +e
          npm run test:run -- --exclude test/voice-agent.test.ts > realtime-voice-test-output.txt 2>&1
          exit 0
      - name: Commit test output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realtime-voice-test-output.txt
          git commit -m "Capture realtime voice test failure"
          git push
